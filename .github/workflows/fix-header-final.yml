name: Fix NIVECO Header Final

on:
  push:
    branches: [flutter-rebuild]
    paths:
      - '.github/workflows/fix-header-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-rebuild
      - name: Patch overflow-proof header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('flutter_app/lib/main.dart')
          s=p.read_text()
          s=s.replace("Image.asset('assets/niveco-eye.png', width: 54, height: 54, fit: BoxFit.contain)", "Image.asset('assets/niveco-eye.png', width: 64, height: 64, fit: BoxFit.contain)")
          old="appBar:AppBar(toolbarHeight:88,backgroundColor:widget.dark?const Color(0xFF071827):Colors.white,titleSpacing:6,title:LayoutBuilder(builder:(context,c)=>SizedBox(width:c.maxWidth,child:Align(alignment:Alignment.centerLeft,child:FittedBox(fit:BoxFit.scaleDown,alignment:Alignment.centerLeft,child:NivecoWordmark(dark:widget.dark))))),actions:[SizedBox(width:42,child:IconButton(padding:EdgeInsets.zero,visualDensity:VisualDensity.compact,onPressed:()=>widget.onThemeChanged(!widget.dark),icon:Icon(widget.dark?Icons.light_mode_outlined:Icons.dark_mode_outlined))),ConstrainedBox(constraints:const BoxConstraints(maxWidth:72),child:TextButton(style:TextButton.styleFrom(padding:const EdgeInsets.symmetric(horizontal:4),minimumSize:Size.zero,tapTargetSize:MaterialTapTargetSize.shrinkWrap),onPressed:()=>widget.onLanguageChanged(!widget.gujarati),child:FittedBox(fit:BoxFit.scaleDown,child:Text(widget.gujarati?'EN':'ગુજરાતી',style:const TextStyle(fontWeight:FontWeight.w700))))),const SizedBox(width:2)],)"
          new="appBar:PreferredSize(preferredSize:const Size.fromHeight(88),child:SafeArea(bottom:false,child:Container(height:88,color:widget.dark?const Color(0xFF071827):Colors.white,padding:const EdgeInsets.symmetric(horizontal:10),child:Row(children:[Expanded(child:ClipRect(child:Align(alignment:Alignment.centerLeft,child:FittedBox(fit:BoxFit.scaleDown,alignment:Alignment.centerLeft,child:NivecoWordmark(dark:widget.dark))))),const SizedBox(width:4),IconButton(visualDensity:VisualDensity.compact,padding:EdgeInsets.zero,constraints:const BoxConstraints.tightFor(width:40,height:40),onPressed:()=>widget.onThemeChanged(!widget.dark),icon:Icon(widget.dark?Icons.light_mode_outlined:Icons.dark_mode_outlined)),SizedBox(width:66,child:TextButton(style:TextButton.styleFrom(padding:const EdgeInsets.symmetric(horizontal:2),minimumSize:Size.zero,tapTargetSize:MaterialTapTargetSize.shrinkWrap),onPressed:()=>widget.onLanguageChanged(!widget.gujarati),child:FittedBox(fit:BoxFit.scaleDown,child:Text(widget.gujarati?'EN':'ગુજરાતી',style:const TextStyle(fontWeight:FontWeight.w700)))))]))))"
          if old not in s:
              raise SystemExit('Expected header block not found; refusing unsafe patch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix NIVECO header overflow permanently"
          git push origin flutter-rebuild

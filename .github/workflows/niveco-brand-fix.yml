name: Refine NIVECO brand header

on:
  push:
    branches: [flutter-rebuild]
    paths:
      - '.github/workflows/niveco-brand-fix.yml'

permissions:
  contents: write

jobs:
  refine-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-rebuild
      - name: Refine eye and three-line E
        shell: python
        run: |
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text()
          s = s.replace("Image.asset('assets/niveco-eye.png', width: 42, height: 42),", "Image.asset('assets/niveco-eye.png', width: 54, height: 54, fit: BoxFit.contain),")
          s = s.replace("const SizedBox(width: 10),", "const SizedBox(width: 8),", 1)
          s = s.replace("fontSize: 26, height: 1", "fontSize: 27, height: 1")
          s = s.replace("SizedBox(width: 22, height: 25, child: CustomPaint(painter: _ThreeLineEPainter(ink)))", "SizedBox(width: 25, height: 27, child: CustomPaint(painter: _ThreeLineEPainter(ink)))")
          s = s.replace("final p = Paint()..strokeCap = StrokeCap.square..strokeWidth = 5;", "final p = Paint()..style = PaintingStyle.fill;")
          s = s.replace("p.color = ink;\n    canvas.drawLine(Offset(0, 3), Offset(size.width, 3), p);\n    p.color = const Color(0xFF00CBEA);\n    canvas.drawLine(Offset(0, size.height / 2), Offset(size.width * .82, size.height / 2), p);\n    p.color = ink;\n    canvas.drawLine(Offset(0, size.height - 3), Offset(size.width, size.height - 3), p);", "final barHeight = size.height * .20;\n    p.color = ink;\n    canvas.drawRRect(RRect.fromRectAndRadius(Rect.fromLTWH(0, 0, size.width, barHeight), const Radius.circular(1.2)), p);\n    p.color = const Color(0xFF00CBEA);\n    canvas.drawRRect(RRect.fromRectAndRadius(Rect.fromLTWH(0, (size.height - barHeight) / 2, size.width * .78, barHeight), const Radius.circular(1.2)), p);\n    p.color = ink;\n    canvas.drawRRect(RRect.fromRectAndRadius(Rect.fromLTWH(0, size.height - barHeight, size.width, barHeight), const Radius.circular(1.2)), p);")
          p.write_text(s)
      - name: Commit brand refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Refine NIVECO eye and three-line E branding"
          git push origin flutter-rebuild

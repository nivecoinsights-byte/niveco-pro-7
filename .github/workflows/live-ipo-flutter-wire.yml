name: Wire Flutter Live IPO Data

on:
  workflow_dispatch:
  push:
    branches: [flutter-rebuild]
    paths:
      - 'flutter_app/lib/live_ipo_service.dart'
      - 'flutter_app/pubspec.yaml'

permissions:
  contents: write

jobs:
  wire-live-data:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-rebuild
          fetch-depth: 0
      - name: Patch Flutter UI for live IPO sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flutter_app/lib/main.dart')
          s = p.read_text()

          if "import 'dart:async';" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'dart:async';\n\nimport 'package:flutter/material.dart';\n\nimport 'live_ipo_service.dart';")

          s = s.replace('const demoIpos=<Ipo>[', 'List<Ipo> demoIpos=<Ipo>[')

          marker = "class NivecoShell extends StatefulWidget"
          if 'Future<void> refreshLiveIpos()' not in s:
              insert = r'''

bool liveDataActive = false;
String liveDataMessage = 'Connecting to live IPO data...';
DateTime? liveDataUpdatedAt;
final LiveIpoService _liveIpoService = LiveIpoService();

String _dateText(dynamic value) {
  final raw = value?.toString() ?? '';
  if (raw.isEmpty) return '—';
  final d = DateTime.tryParse(raw);
  if (d == null) return raw;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return '${d.day.toString().padLeft(2, '0')} ${months[d.month - 1]} ${d.year}';
}

String _statusText(Map<String, dynamic> row) {
  final normalized = (row['status'] ?? '').toString().toLowerCase();
  final source = (row['sourceStatus'] ?? '').toString().toLowerCase();
  if (normalized == 'listed') return 'Listed';
  if (normalized == 'upcoming') return 'Upcoming';
  if (source == 'closed') return 'Closed';
  return 'Open';
}

Ipo _ipoFromLive(Map<String, dynamic> row) {
  final subscription = (row['subscription'] as num?)?.toDouble() ?? 0;
  final lot = (row['lotSize'] as num?)?.toInt() ?? 0;
  final listingPrice = (row['listingPrice'] as num?)?.toInt();
  return Ipo(
    id: (row['id'] ?? row['symbol'] ?? row['company'] ?? '').toString(),
    name: (row['company'] ?? 'IPO').toString(),
    type: ((row['issueType'] ?? '').toString().toUpperCase() == 'SME') ? 'SME' : 'MAINBOARD',
    status: _statusText(row),
    priceBand: (row['priceBand'] ?? 'TBA').toString(),
    lotSize: lot,
    subscription: subscription,
    gmp: 0,
    gmpPct: 0,
    openDate: _dateText(row['openDate']),
    closeDate: _dateText(row['closeDate']),
    allotmentDate: _dateText(row['allotmentDate']),
    listingDate: _dateText(row['listingDate']),
    issueSize: '—',
    listingPrice: listingPrice,
    listingGain: null,
  );
}

Future<void> refreshLiveIpos() async {
  try {
    final result = await _liveIpoService.fetch();
    final rows = result.records.map(_ipoFromLive).where((i) => i.name.trim().isNotEmpty).toList();
    if (rows.isEmpty) {
      liveDataActive = false;
      liveDataMessage = 'Live source returned no IPO records';
      return;
    }
    demoIpos = rows;
    liveDataActive = true;
    liveDataUpdatedAt = result.updatedAt ?? DateTime.now();
    liveDataMessage = 'Live data • ${result.source}';
  } catch (e) {
    liveDataActive = false;
    liveDataMessage = 'Live sync unavailable • showing last available data';
  }
}

'''
              s = s.replace(marker, insert + marker)

          old = "class _NivecoShellState extends State<NivecoShell>{int index=0;final saved=<String>{};String tr(String en,String gu)=>widget.gujarati?gu:en;@override Widget build(BuildContext context){"
          if old in s:
              new = "class _NivecoShellState extends State<NivecoShell>{int index=0;final saved=<String>{};Timer? _liveTimer;String tr(String en,String gu)=>widget.gujarati?gu:en;@override void initState(){super.initState();_syncLive();_liveTimer=Timer.periodic(const Duration(minutes:30),(_)=>_syncLive());}Future<void> _syncLive() async{await refreshLiveIpos();if(mounted)setState((){});}@override void dispose(){_liveTimer?.cancel();super.dispose();}@override Widget build(BuildContext context){"
              s = s.replace(old, new)

          s = s.replace("Text(tr('Data ready','ડેટા તૈયાર'),style:const TextStyle(color:Colors.blueGrey))", "Text(liveDataActive ? tr('Live data connected','લાઇવ ડેટા જોડાયેલ') : tr(liveDataMessage,liveDataMessage),style:const TextStyle(color:Colors.blueGrey))")
          s = s.replace("const Icon(Icons.refresh)])))", "IconButton(onPressed:() async{await refreshLiveIpos();if(mounted)setState((){});},icon:const Icon(Icons.refresh))])))")

          p.write_text(s)
          PY
      - name: Validate patch markers
        run: |
          grep -q "refreshLiveIpos" flutter_app/lib/main.dart
          grep -q "LiveIpoService" flutter_app/lib/main.dart
          grep -q "Timer.periodic" flutter_app/lib/main.dart
      - name: Commit live data wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Wire Flutter UI to live IPO API"
          git push origin flutter-rebuild
